<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#FFFFFF" id="theme-color-meta" />
    <script>
      // Resolve the theme before first paint to avoid a flash. Mirrors the
      // `theme` state in App.jsx (theme_v1: "system" | "light" | "dark").
      (function () {
        try {
          var raw = localStorage.getItem("theme_v1");
          var choice = raw ? JSON.parse(raw) : "system";
          var dark = choice === "dark" || (choice !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.dataset.theme = dark ? "dark" : "light";
          var m = document.getElementById("theme-color-meta");
          if (m) m.setAttribute("content", dark ? "#1B1B1A" : "#FFFFFF");
        } catch (e) {}
      })();
    </script>
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Meals" />
    <meta name="description" content="Macro-balanced weekly meal planning. Set your targets, get a seven-day plan, eat sharp." />
    <meta property="og:title" content="Meals — Plan the week, eat sharp." />
    <meta property="og:description" content="Macro-balanced weekly meal planning. Set your targets, get a seven-day plan, eat sharp." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <title>Meals — Plan the week, eat sharp.</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
